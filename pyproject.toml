[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-uz"
version = "0.1.0"
description = "Document Q&A with source citations over Uzbek and Russian legal documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pytesseract>=0.3.10",
    "pillow>=10",
    # retrieval (stage 2): dense embeddings (ONNX, no PyTorch) and the vector index
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "qdrant-client>=1.10",  # query_points
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# stage 5, on Kaggle (GPU) or for scripts/export_onnx.py; never needed by the service
finetune = ["torch>=2.1", "transformers>=4.40", "sentence-transformers>=3.0", "onnx>=1.15"]
dev = ["pytest>=8", "ruff>=0.5", "reportlab>=4", "rapidfuzz>=3", "fastapi>=0.110",
       "httpx>=0.27"]

[project.scripts]
documind = "documind.cli:main"

[tool.setuptools.packages.find]
include = ["documind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ocr: needs the tesseract binary with uzb, uzb_cyrl and rus models",
    "postgres: needs TEST_DATABASE_URL pointing at a PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
