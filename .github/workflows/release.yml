# Publishes the API and web images to GitHub Packages (ghcr.io) when a version tag is pushed.
# The images contain code only: no lex.uz documents, models, databases or secrets
# (see .dockerignore and deploy/web/Dockerfile.dockerignore); those are fetched at run time.
name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: documind-api
            dockerfile: Dockerfile
            description: DocuMind UZ API (FastAPI, tesseract uzb/uzb_cyrl/rus)
          - name: documind-web
            dockerfile: deploy/web/Dockerfile
            description: DocuMind UZ web UI (React build served by Caddy)
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # v0.1.0 -> 0.1.0 and 0.1; "latest" only for releases without a pre-release suffix
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
